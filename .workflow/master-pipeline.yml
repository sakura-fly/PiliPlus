# =============================================================================
# PiliPlus —— Gitee Go 流水线：打包 Android APK
# 参考 .github/workflows/build.yml 的 android job 编写（非逐行照搬）。
#
# 触发：文件名决定触发类型（Gitee Go 与 GitHub 的 on.push 不同）：
#   master-pipeline.yml -> master 分支 push（本文件）
#   tag-pipeline.yml    -> 推送 Tag
#   custom-pipeline.yml -> 手动触发
#   需要 release 分支触发：复制为 BranchPipeline.yml 或在控制台绑定分支。
#
# 使用前配置（Gitee Go 控制台）：
#   1. 私密环境变量：SIGN_KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
#      KEY_ALIAS / KEY_PASSWORD（不配则出未签名包）
#   2. 「构建产物」归档路径：PiliPlus_android_*.apk
#
# 说明：Gitee Go 自动检出代码；步骤间环境不共享，公共环境写在
#       $HOME/.piliplus_env.sh，后续步骤开头 source。
# 参考文档：https://help.gitee.com/gitee-go/pipeline/trigger
# =============================================================================

version: 1.0
displayName: PiliPlus Android 打包

stages:
  - displayName: 构建
    steps:
      - displayName: 准备环境（Flutter / Android SDK / JDK17 / PowerShell）
        run: |
          set -e

          # 基础依赖
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip zip git openjdk-17-jdk-headless

          # PowerShell（build.ps1 / patch.ps1 需要），失败则回退官方压缩包
          if ! command -v pwsh >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/microsoft.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq powershell || {
              curl -fsSL -o /tmp/pwsh.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz
              sudo mkdir -p /opt/microsoft/powershell/7
              sudo tar zxf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
              sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
            }
          fi

          # Flutter（版本与 pubspec.yaml 保持一致）
          if [ ! -d "$HOME/flutter" ]; then
            git clone -q --depth 1 -b 3.47.2 https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          export PATH="$HOME/flutter/bin:$PATH"

          # Android SDK（执行器未自带时安装）
          if [ -z "${ANDROID_HOME:-}" ] && [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" >/dev/null
          fi

          # 保存公共环境，供后续步骤 source
          printf '%s\n' \
            'export PATH="$HOME/flutter/bin:$PATH"' \
            'export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"' \
            'export ANDROID_SDK_ROOT="$ANDROID_HOME"' \
            'export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"' \
            > "$HOME/.piliplus_env.sh"

      - displayName: 生成版本号
        run: |
          set -e
          set -a; . "$HOME/.piliplus_env.sh"; set +a
          # build.ps1 会写 GITHUB_ENV，指到本地文件以兼容
          export GITHUB_ENV="$PWD/.piliplus_github_env"
          pwsh -File lib/scripts/build.ps1 android
          cat .piliplus_github_env

      - displayName: 应用补丁
        run: |
          set -a; . "$HOME/.piliplus_env.sh"; set +a
          pwsh -File lib/scripts/patch.ps1 android || true

      - displayName: 写入签名配置
        run: |
          set -e
          if [ -n "$SIGN_KEYSTORE_BASE64" ]; then
            echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "签名文件已写入"
          else
            echo "未配置签名，将构建未签名 APK"
          fi

      - displayName: 构建并重命名 APK
        run: |
          set -e
          set -a; . "$HOME/.piliplus_env.sh"; set +a
          flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub
          version=$(sed -n 's/^version=//p' .piliplus_github_env)
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliPlus_android_${version}_${abi}.apk"
          done
          ls -lh PiliPlus_android_*.apk

      - displayName: 产物提示
        run: |
          echo "构建完成，产物："
          ls -lh PiliPlus_android_*.apk
          echo
          echo "请在 Gitee Go 控制台「构建产物」中配置归档路径："
          echo "  PiliPlus_android_*.apk"
